.wait-calc .sc-entry h2 {font-size:1.35rem;letter-spacing:-.035em;}

.wait-output {padding:var(--space-md) 1.25rem;}
.wait-lines {margin:0;}

.wait-lines dd {flex:0 0 auto;margin:0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.wait-insight {font-size:.98rem;font-weight:600;line-height:1.5;}
.wait-print-only {display:none;}
.wait-example {margin-top:var(--space-md);border-top:1px solid var(--line);padding:.8rem 0;max-width:70ch;}

.wait-example p {font-size:.9rem;line-height:1.5;}
@media print {

  .wait-calc .sc-layout,.wait-print-only {display:block!important;}

@media(max-width:870px){.shell{grid-template-columns:195px minmax(0,1fr);}.sidebar{padding:1.65rem .72rem var(--space-md);}.desk-name{font-size:1.38rem;}nav a{font-size:.9rem;gap:.55rem;}.main{padding:0 var(--space-md);}.page-heading{align-items:flex-start;flex-wrap:wrap;gap:.65rem;}.basic-grid{grid-template-columns:1fr;}.guide-layout{grid-template-columns:1fr;}.related>div{grid-template-columns:1fr;}.related .tool-tile{min-height:3.55rem;}.related .tool-tile span:nth-child(2){display:flex;gap:var(--space-xs);align-items:baseline;flex-wrap:wrap;}}
@media(max-width:700px){.shell{display:block;min-height:0;}.mobile-head{display:flex;justify-content:space-between;align-items:center;padding:.65rem var(--space-md);border-bottom:1px solid var(--line);background:var(--color-paper);}.mobile-head img{width:147px;height:auto;}.sidebar{display:none;}.menu-open .sidebar{position:fixed;top:3.9rem;left:0;bottom:0;z-index:8;width:min(19rem,100%);max-height:calc(100dvh - 3.9rem);min-height:0;height:auto;display:flex;box-shadow:6px 8px 18px var(--color-menu-shadow);padding:1.3rem var(--space-md);}.menu-open .sidebar .brand{display:none;}.main{padding:0 var(--space-md);}.desk-head{min-height:5.6rem;padding:var(--space-md) 0;}.desk-title{font-size:1.4rem;}.desk-head p{font-size:.77rem;}.desk-head .ghost{padding:.45rem .6rem;font-size:.78rem;}.desk-head .ghost .icon svg{width:.85rem;}.page-heading{padding:1.3rem 0 var(--space-md);}h1{font-size:2rem;}.page-heading p{font-size:.92rem;}.property-card img{width:100px;height:68px;}.overview-tools,.dir-list{grid-template-columns:1fr;}.dir-filters{flex-direction:column;}.guide-layout{margin-top:1.4rem;}footer{align-items:flex-start;flex-direction:column;}.dir-filters input,.dir-filters select,.scalc input,.scalc select{font-size:16px;}}
@media(max-width:350px){.main{padding:0 .7rem;}.desk-head .ghost{gap:.18rem;}.property-card{gap:.65rem;}}
@media print {.sidebar,.mobile-head,.desk-head,#heading-actions,.related,footer,.skip,.scalc [data-action=print]{display:none!important;}.shell,.main{display:block;padding:0;max-width:none;}.page-heading{padding:.3rem 0 var(--space-md);}.guide-layout{display:block;}.step-list li,.dir-list article{break-inside:avoid;}.wire-panel,.check-panel{margin:var(--space-md) 0;}}

[data-section="guide"] .guide-packet {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1.4rem;
  margin-bottom: 1.15rem;
  padding: 1.3rem 1.45rem;
  border: 1px solid var(--line);
  border-radius: 6px;
}
.guide-packet h2, .preopen-guide h2 {margin: 0; font-size: 1.35rem; letter-spacing: -.025em;}
.guide-packet p, .preopen-guide p, .preopen-guide li {font-size: .95rem; line-height: 1.5;}
.guide-packet p, .preopen-guide p {margin: .45rem 0 0;}
.guide-packet-action {display: grid; justify-items: start; gap: .35rem; flex: 0 0 auto;}

.guide-resource-groups a {display: block; margin: 0 0 .65rem; line-height: 1.4;}
.guide-listing, .dir-listing {background:var(--pale);border-block:1px solid var(--line);padding:.85rem 1.1rem;margin:0 0 var(--space-md);overflow-wrap:anywhere;}

  width: min(calc(100% - var(--entry-gutter) * 2), 84rem);
  margin-inline: auto;

.entry-mast {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-md);
  padding: 1.35rem 0 1.2rem;
  border-bottom: 1px solid var(--line);

.entry-main {flex: 1; display: grid; align-content: center; padding-block: clamp(var(--space-xl), 6vh, var(--space-3xl));}
.entry-panel {display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); align-items: center; gap: clamp(2.4rem, 5.5vw, var(--space-3xl));}

#listing-form {display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label label" "address submit" "hint hint" "price price" "error error" "unmatched unmatched"; column-gap: var(--space-xs);}
.entry-label {display: block; grid-area: label; margin-bottom: .42rem; font-size: .93rem; font-weight: 700; color: var(--ink);}

  grid-area: submit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .55rem;
  min-height: 3.2rem;

  border: 1px solid var(--accent);
  border-radius: .3rem;
  background: var(--accent);

  font-size: .96rem;
  font-weight: 690;
  white-space: nowrap;
}

.entry-hint {grid-area: hint; margin: .42rem 0 .2rem; font-size: .82rem; color: var(--muted); line-height: 1.43;}
#listing-options {grid-area: price; margin: 0;}
#listing-options summary {display: inline-flex; align-items: center; gap: .3rem; min-height: 2.6rem; width: fit-content; color: var(--accent); font-size: .88rem; font-weight: 650; cursor: pointer; list-style: none;}
#listing-options summary::-webkit-details-marker {display: none;}
#listing-options summary::before {content: "+"; display: inline-block; font-size: 1.2rem; line-height: .9; font-weight: 450; margin-right: .1rem;}
#listing-options[open] summary::before {content: "−";}
#listing-options[open] {padding-bottom: .65rem;}
#listing-options summary span {color: var(--muted); font-weight: 430;}
#entry-error {grid-area: error; margin: .35rem 0; color: var(--color-error); font-size: .9rem; line-height: 1.4;}
#open-unmatched {grid-area: unmatched; text-decoration: underline;}
.entry-alternatives {display: flex; flex-wrap: wrap; align-items: center; gap: 0 1.25rem; margin: .65rem 0 0; padding-top: .7rem; border-top: 1px solid var(--line);}
.entry-secondary {min-height: 2.65rem; padding: .4rem 0; font-size: .87rem;}
.entry-privacy {max-width: 67ch; margin: .35rem 0 0; color: var(--muted); font-size: .79rem; line-height: 1.45;}
.entry-visual {min-width: 0; margin: 0;}
.entry-visual > img {display: block; width: 100%; height: auto; aspect-ratio: 1.08; object-fit: cover; object-position: 50% 51%; border-radius: .15rem;}
.entry-caption {margin-top: .65rem; padding-top: .65rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem;}
.entry-footer {display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .3rem var(--space-md); margin-top: 0; padding: .9rem 0 1.1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .79rem;}
.entry-footer .footer-links {display: flex; gap: var(--space-md);}
.entry-footer a {display: inline-flex; align-items: center; min-height: 2.3rem; color: var(--muted);}
.desk-identity {min-width:0;}
.desk-head .desk-title {overflow-wrap:anywhere;}
.desk-bar-actions {display:flex;align-items:center;gap:.45rem;}
.listing-quick-links {display:flex;gap:.4rem var(--space-md);flex-wrap:wrap;margin:.65rem 0 0;}
.listing-quick-links a {font-size:.85rem;font-weight:650;}
.property-card[data-listing] img {display:none;}
.property-card[data-listing] {padding:.35rem 0;border-bottom:1px solid var(--line);margin-bottom:1.25rem;}
.parcel-check {border-block:1px solid var(--line);background:var(--pale);padding:.78rem .9rem;margin:.85rem 0;border-radius:0 .3rem .3rem .0;}
.parcel-check strong {font-size:.94rem;color:var(--ink);}
.parcel-check p {font-size:.85rem;line-height:1.4;margin:.35rem 0 .6rem;}
.parcel-check .parcel-result:empty {display:none;}
.parcel-check .parcel-result {margin-top:.6rem;}
.parcel-check button {min-height:2.3rem;}
.owner-rate>summary span {color:var(--accent);font-variant-numeric:tabular-nums;font-size:.88rem;margin-left:.35rem;}
.owner-rate [data-premium-description] {line-height:1.5;font-size:.9rem;margin:.35rem 0 .8rem;}
.fee-review {padding:.72rem var(--space-md);background:var(--color-paper-2);border-bottom:1px solid var(--line);color:var(--body);font-size:.83rem;line-height:1.45;}
.fee-review .text-button {font-size:inherit;min-height:0;padding:.24rem 0;}
@media print {.fee-review{display:none!important;}}
@media print {.parcel-check{display:none!important;}}
@media (max-width: 1120px) and (min-width: 761px) {
  #listing-form {grid-template-columns: 1fr; grid-template-areas: "label" "address" "hint" "price" "submit" "error" "unmatched";}
  #open-listing {justify-self: start; margin-top: .2rem;}
  .entry-visual > img {aspect-ratio: .83;}
}
@media (max-width: 960px) {
  .desk-bar-actions {flex-wrap: wrap; justify-content: flex-end;}
}
@media (max-width: 760px) {
  #listing-entry {--entry-gutter: clamp(1rem, 5vw, 2.2rem);}
  .entry-mast {padding-block: .6rem;}
  .entry-brand img {width: clamp(8.6rem, 34vw, 10rem);}
  .entry-contact {font-size: .84rem; gap: .26rem;}
  .entry-panel {grid-template-columns: 1fr; gap: 1.4rem;}
  .entry-main {padding: 1.6rem 0 1.2rem; align-content: start;}
  .entry-kicker {gap: .2rem .6rem; margin-bottom: .65rem;}
  .entry-kicker strong {font-size: .82rem;}
  .entry-kicker span {font-size: .78rem; padding-left: .6rem;}
  #entry-title {font-size: clamp(2.35rem, 8.2vw, 3.4rem); max-width: 17ch; line-height: 1.035;}
  .entry-intro {font-size: 1rem; margin: .55rem 0 1.3rem;}
  #listing-form {grid-template-columns: 1fr; grid-template-areas: "label" "address" "hint" "price" "error" "unmatched" "submit";}
  #open-listing {justify-content: space-between; margin-top: .2rem; padding-inline: var(--space-md);}
  .entry-alternatives {margin-top: .62rem; padding-top: .35rem; gap: 0 var(--space-md);}
  .entry-privacy {margin-top: .16rem;}
  .entry-visual > img {aspect-ratio: 2.75; object-position: 50% 52%;}
  .entry-caption {margin-top: .45rem; padding: 0; border: 0;}
  .entry-footer {font-size: .76rem; padding: .65rem 0 .8rem;}
}
@media (max-width: 700px) {
  .desk-head:has(.desk-bar-actions) {align-items: flex-start; flex-wrap: wrap; gap: .55rem;}
  .desk-bar-actions {justify-content: flex-start;}
  .desk-bar-actions button {min-height: 2.5rem;}
}
@media (max-width: 350px) {
  .entry-brand img {width: 7.9rem;}
  .entry-contact {font-size: .78rem;}
  .entry-alternatives {gap: 0 .8rem;}
  .entry-secondary {font-size: .8rem;}
}
@media print {#listing-entry,.listing-quick-links{display:none!important;}}

/* The masthead, listing context and six destinations shown on the overview. */
:root {
  --ink: var(--color-ink);
  --body: var(--color-ink-2);
  --muted: var(--color-muted);
  --accent: var(--color-accent);
  --blue: var(--color-focus);
  --paper: var(--color-paper);
  --line: var(--color-rule);
  --pale: var(--color-paper-2);
  --content-edge: clamp(1rem, 4vw, 4rem);
  --content-width: 87rem;
}

.shell {display:block; max-width:none; min-height:100dvh;}
.main,.desk-mast,.nav-wrap nav {width:min(100%,var(--content-width)); margin-inline:auto; padding-inline:var(--content-edge);}
.main {max-width:none;}
.sidebar {position:static; display:block; width:100%; height:auto; min-height:0; padding:0; overflow:visible; border:0; background:var(--paper);}
.desk-mast,.site-signature,.side-contact,.desk-phone {display:flex; align-items:center;}
.desk-mast {min-height:5.15rem; justify-content:space-between; gap:var(--space-md);}
.site-signature {gap:1.3rem;}
.site-signature .brand {width:10.75rem; max-width:none; margin:0;}
.site-signature>div {border-inline-start:1px solid var(--line); padding-inline-start:1.25rem;}
.desk-name {margin:0; font-size:1.25rem; letter-spacing:-.035em; font-weight:760; line-height:1.15;}
.side-sub,.side-contact small {margin:.1rem 0 0; font-size:.78rem; line-height:1.25; color:var(--muted);}
.side-contact {border:0; gap:1.25rem; padding:0;}
.side-contact .profile-link,.side-contact .desk-phone {margin:0; min-height:1.5rem; color:var(--accent); font-weight:650;}
.side-contact .profile-link {font-size:.94rem;}
.side-contact .desk-phone {min-height:2.75rem; font-variant-numeric:tabular-nums;}
.side-contact .profile-link .icon svg {width:.76rem; height:.76rem;}
.nav-wrap {padding:0; background:var(--accent); border:0;}
.nav-wrap nav {display:flex; flex-direction:row; gap:clamp(.25rem,1vw,1.2rem); justify-content:space-between;}
.nav-wrap nav a {border:0; border-bottom:3px solid transparent; border-radius:0; background:transparent; color:var(--paper); font-weight:560; font-size:.91rem; min-height:3rem; gap:.52rem; padding:.65rem .28rem .5rem;}
.nav-wrap nav a .icon svg {width:1.02rem; height:1.02rem;}
.nav-wrap nav a:hover,.nav-wrap nav a[aria-current=page] {background:transparent; color:var(--paper); border-bottom-color:var(--paper);}
.nav-wrap nav a[aria-current=page] {font-weight:760;}
.nav-wrap nav a:focus-visible {outline:2px solid var(--paper); outline-offset:-4px;}
.desk-head {min-height:3.8rem; padding:.65rem 0; gap:.75rem; border-bottom:1px solid var(--line);}
.desk-identity {display:flex; flex-wrap:wrap; gap:.3rem .65rem; align-items:baseline; min-width:0;}
.desk-head .desk-title {font-size:1.02rem; line-height:1.35; letter-spacing:-.015em; font-weight:700;}
.desk-head p {font-size:.84rem; margin:0; line-height:1.35;}
.desk-head p .icon {display:none;}
.desk-bar-actions {display:flex; gap:.65rem; flex-shrink:0;}
.desk-bar-actions .ghost {border:0; border-radius:var(--radius-card); padding:.4rem .35rem; min-height:2.6rem; font-size:.84rem;}
.page-heading {padding:var(--space-lg) 0 1.2rem; align-items:center; gap:.7rem 1.25rem;}
.page-heading h1 {font-size:2.35rem; line-height:1.1; letter-spacing:-.045em; max-width:none;}
.page-heading p {margin:.35rem 0 0; font-size:.98rem;}
.ghost,.primary,.icon-button,.text-button {border-radius:var(--radius-card);}
.primary {color:var(--color-accent-ink); background:var(--accent); border-color:var(--accent);}
.primary:hover:enabled {background:var(--ink); border-color:var(--ink);}
button:disabled,.scalc .sc-btn:disabled {background:var(--color-paper-2); color:var(--muted); border-color:var(--line); opacity:1; cursor:not-allowed;}
button:enabled:active,a:active,summary:active {transform:translateY(1px);}
.label {text-transform:none; letter-spacing:normal; font-weight:650; font-size:.81rem; color:var(--muted);}
.main>footer {font-size:.82rem; padding:1.25rem 0;}
.main>footer a:hover,.tool-tile:hover strong {text-decoration:underline;}
.related {margin-top:1.7rem;}
.related>div {gap:1.6rem;}
.related .tool-tile,.overview-tools .tool-tile {border:0; border-top:1px solid var(--line); border-radius:0; box-shadow:none; background:transparent; padding:.85rem .15rem; gap:.9rem; min-width:0;}
.related .tool-tile {min-height:3.6rem;}
.related .tool-tile strong {font-size:.95rem;}
.tool-tile small {font-size:.85rem; line-height:1.45;}
.overview-tools {display:grid; grid-template-columns:1fr 1fr; gap:clamp(1.2rem,4vw,4.5rem); align-items:start;}
.overview-tools section {min-width:0; padding:clamp(1.1rem,2.2vw,2rem);}
.overview-ledger {background:var(--pale);}
.overview-reference {padding-inline:0;}
.overview-tools h2 {font-size:1.45rem; margin:0 0 1.05rem; letter-spacing:-.035em;}
.overview-tools .tool-tile {min-height:5rem;}
.overview-tools .tool-tile strong {font-size:1.04rem;}
.overview-tools .tool-tile>.icon:first-child {color:var(--accent);}
.overview-tools .tool-tile>.icon:last-child {color:var(--muted);}
.overview-tools .tool-tile:focus-visible,.related .tool-tile:focus-visible {outline-offset:0;}
dialog {box-shadow:none; border-color:var(--color-field); border-radius:.35rem;}
.mobile-head {display:none;}

@media (min-width:701px) and (max-width:1000px) {
  .nav-wrap nav {gap:.2rem;}
  .nav-wrap nav a {font-size:.82rem; padding-inline:.15rem;}
  .nav-wrap nav a .icon {display:none;}
}
@media (max-width:700px) {
  .mobile-head {display:flex; align-items:center; justify-content:space-between; gap:.65rem; padding:.6rem var(--content-edge); min-height:3.7rem; position:sticky; top:0; z-index:9; background:var(--paper); border-bottom:1px solid var(--line);}
  .mobile-head img {width:7.9rem;}
  .mobile-head>span {flex:1; font-size:.83rem; font-weight:700; line-height:1.1; color:var(--ink); padding-left:.65rem; border-left:1px solid var(--line);}
  .mobile-head .ghost {min-height:2.65rem; padding:.4rem .6rem; border-color:var(--line);}
  .shell .sidebar {display:none;}
  .menu-open .sidebar {display:flex; flex-direction:column; justify-content:flex-start; gap:0; position:fixed; top:3.85rem; left:0; right:0; bottom:auto; width:100%; max-height:calc(100dvh - 3.85rem); min-height:0; overflow:auto; z-index:8; padding:0; background:var(--paper); border-bottom:2px solid var(--accent); box-shadow:none;}
  .menu-open .desk-mast {order:1; min-height:0; padding:var(--space-md) var(--content-edge);}
  .menu-open .site-signature {display:none;}
  .menu-open .side-contact {width:100%; justify-content:space-between; gap:.65rem;}
  .menu-open .nav-wrap {background:var(--pale);}
  .menu-open nav {flex-direction:column; gap:0;}
  .menu-open nav a {border:0; border-bottom:1px solid var(--line); padding:.65rem .3rem; min-height:2.75rem; color:var(--body); gap:.8rem;}
  .menu-open nav a:hover,.menu-open nav a[aria-current=page] {color:var(--accent); border-bottom-color:var(--line); text-decoration:underline; text-underline-offset:.25em;}
  .menu-open nav a:focus-visible {outline-color:var(--accent);}
  .desk-head:has(.desk-bar-actions) {display:flex; flex-wrap:wrap; align-items:center; min-height:0; padding:.55rem 0; gap:.15rem .7rem;}
  .desk-identity {gap:0 .5rem;}
  .desk-head .desk-title {font-size:.93rem;}
  .desk-head p {font-size:.78rem;}
  .desk-bar-actions {gap:.6rem; margin-left:auto;}
  .desk-bar-actions button.ghost {min-height:2.65rem; padding:.25rem .1rem; font-size:.79rem; gap:.27rem;}
  .page-heading {padding:1.05rem 0 .9rem; align-items:flex-start;}
  .page-heading h1 {font-size:1.9rem;}
  .page-heading p {font-size:.92rem;}
  #heading-actions {gap:.5rem;}
  #heading-actions button {min-height:2.65rem;}
  .related>div,.overview-tools {grid-template-columns:1fr; gap:0;}
  .overview-tools {gap:1.3rem;}
  .overview-tools .overview-reference {padding:.3rem .25rem;}
  .related .tool-tile {min-height:3.4rem;}
}
@media print {
  .shell .sidebar,.mobile-head,.desk-head,.main>footer {display:none!important;}
  .shell,.main {width:100%; max-width:none; min-height:0; padding:0;}
  .page-heading {padding:.3rem 0 .7rem;}
}

/* Financial worksheets share the same ruled totals and right-aligned amounts. */
.fee-review-mobile { display: none; }
@media screen {
  .scalc {
    color: var(--sc-text);
    font-family: var(--sc-font);
    min-width: 0;
  }
  .scalc :is(h2,h3,h4) {
    margin: 0 0 var(--space-md, 1rem);
    line-height: 1.23;
    font-weight: 700;
    letter-spacing: -.025em;
    overflow-wrap: break-word;
    min-width: 0;
  }
  .scalc h2 { font-size: 1.38rem; }
  .scalc h3 { font-size: 1.13rem; }
  .scalc .sc-layout {
    grid-template-columns: minmax(0, 1.25fr) minmax(0, .9fr);
    align-items: start;
    gap: clamp(2rem, 4.6vw, 4.75rem);
  }
  .scalc :is(.sc-entry,.sc-common,.sc-compare,.sc-offer) {
    padding: 0;
    border: 0;
    border-radius: 0;
    background: var(--sc-paper);
  }
  .scalc .sc-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    column-gap: 1.25rem;
    row-gap: var(--space-md, 1rem);
  }
  .scalc .sc-grid > .sc-field:only-child { grid-column: 1 / -1; }
  .scalc .sc-field > span:first-child { color: var(--sc-text); font-size: .89rem; }
  .scalc .sc-grid:has(.sc-location-meaning) {align-items: start;}
  .scalc .sc-location-meaning {color: var(--sc-muted);font-size: .84rem;font-weight: 400;line-height: 1.4;}
  .scalc .sc-tax-links {display: flex;flex-wrap: wrap;gap: .35rem var(--space-md, 1rem);}
  .scalc .sc-field > input,.scalc .sc-field > select,.scalc .sc-input {
    height: 2.75rem;
    border-radius: .22rem;
    border-color: var(--sc-field);
    font-size: 1rem;
  }
  .scalc .sc-currency input,.scalc .sc-offer-figure,.scalc .sc-table {font-variant-numeric: tabular-nums;}
  .scalc .sc-currency input { font-weight: 600; }
  .scalc input::placeholder { color: var(--sc-muted); font-weight: 400; }
  .scalc :is(input,select,button,summary,a):focus-visible,
  .scalc .sc-input:focus-within,.scalc .sc-scroll:focus-visible {
    outline: 2px solid var(--sc-focus);
    outline-offset: 2px;
  }
  .scalc .sc-input>input:focus-visible {outline: 0;}
  .scalc .sc-field input:disabled,.scalc .sc-field select:disabled,.scalc button:disabled {
    background: var(--sc-light);
    border-color: var(--sc-rule);
    color: var(--sc-muted);
    cursor: not-allowed;
    opacity: 1;
  }
  .scalc :is(.sc-btn,.wait-print):active:enabled {
    color: var(--sc-paper);
    background: var(--sc-brand);
    border-color: var(--sc-brand);
  }
  .scalc .sc-details > summary,.scalc .wait-example summary {
    min-height: 2.8rem;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    column-gap: .45rem;
    font-size: .95rem;
  }
  .scalc .sc-details > summary:hover,.scalc .wait-example summary:hover {color: var(--sc-brand);}
  .scalc .sc-note,.scalc .sc-source,.scalc .sc-fine {
    max-width: 68ch;
    font-size: .86rem;
    line-height: 1.52;
  }
  .scalc [data-sc-core] {margin-bottom: 1.1rem;}
  .scalc .property-card,.scalc .property-card[data-listing] {
    margin: .9rem 0;
    padding: .8rem 0;
    border: 0;
    border-block: 1px solid var(--sc-rule);
  }
  .scalc .property-card[data-listing] strong {font-size: .99rem;}
  .scalc .property-card .label {letter-spacing: 0;text-transform: none;}
  .scalc .parcel-check {
    padding: .85rem var(--space-md, 1rem);
    margin: .9rem 0;
    border: 0;
    background: var(--sc-light);
    border-radius: .2rem;
  }
  .scalc .owner-rate > summary span {margin-left: 0;}
  .scalc [data-sc-tax-basis] + .sc-details {margin-top: .8rem;}
  .scalc .sc-result {
    --sc-pad: clamp(1rem, 2vw, 1.6rem);
    padding: 0 0 1.2rem;
    overflow: visible;
    border: 1px solid var(--sc-rule);
    border-top: 3px solid var(--sc-ink);
    border-radius: 0;
    background: var(--sc-paper);
  }
  .scalc .sc-result-top {
    padding: 1.2rem var(--sc-pad) var(--space-md, 1rem);
    background: var(--sc-light);
    border-bottom: 1px solid var(--sc-rule);
  }
  .scalc .sc-result-top > p:first-child {font-size: 1rem; color: var(--sc-ink);}
  .scalc .sc-result-top > strong {
    color: var(--sc-ink);
    font-size: clamp(2.1rem, 3.35vw, 3.35rem);
    line-height: 1.12;
    letter-spacing: -.045em;
    font-weight: 670;
  }
  .scalc .sc-result-top [data-sc-listing] {
    margin: .8rem 0 0;
    padding-top: .65rem;
    border-top: 1px solid var(--sc-rule);
    color: var(--sc-muted);
    font-size: .83rem;
    font-weight: 500;
  }
  .scalc .sc-result-detail {padding-top: 1.1rem;}
  .scalc .sc-result-detail h2 {font-size: 1.04rem; margin-bottom: .3rem;}
  .scalc .sc-result .sc-lines > div,.scalc .wait-lines > div {
    padding: .65rem 0;
    font-size: .89rem;
    border-color: var(--sc-rule);
  }
  .scalc .sc-lines .sc-net-total {
    margin: var(--space-2xs, .25rem) 0 0;
    padding: var(--space-sm, .75rem) 0;
    border-radius: 0;
    border-top: 2px solid var(--sc-ink);
    border-bottom: 0;
    background: var(--sc-paper);
    color: var(--sc-ink);
  }
  .scalc .fee-review {background: var(--sc-paper);padding: .7rem var(--sc-pad);border-bottom: 1px solid var(--sc-rule);}
  .scalc .sc-btn,.scalc .wait-print {border-radius: .25rem;min-height: 2.75rem;}
  .scalc .sc-print:enabled,.scalc .wait-print:enabled {
    border-color: var(--sc-brand);
    background: var(--sc-brand);
    color: var(--sc-paper);
  }
  .scalc .sc-print:enabled:hover,.scalc .wait-print:enabled:hover {background: var(--sc-ink);}
  .scalc .sc-eagle {
    margin: 1.35rem 0 0;
    padding: var(--space-md, 1rem) 0;
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: .65rem 1.25rem;
    align-items: center;
    border: 0;
    border-top: 1px solid var(--sc-rule);
    border-radius: 0;
    background: var(--sc-paper);
  }
  .scalc .sc-eagle h2 {margin: 0; font-size: 1.03rem;}
  .scalc .sc-eagle p {max-width: 65ch; margin: .35rem 0 0; color: var(--sc-muted);font-size: .89rem;}
  .scalc .sc-eagle .sc-btn {margin: 0;}
  .scalc .sc-eagle-status,.scalc [data-eagle-fallback] {grid-column: 1 / -1;}
  .scalc .sc-common {
    display: grid;
    grid-template-columns: minmax(0,1.25fr) minmax(0,.9fr);
    column-gap: clamp(2rem,4.6vw,4.75rem);
    align-items: start;
    border-bottom: 1px solid var(--sc-rule);
    padding-bottom: 1.15rem;
    margin-bottom: 1.55rem;
  }
  .scalc .sc-common h2 {grid-column: 1 / -1;}
  .scalc .sc-shared-options {border-top: 1px solid var(--sc-rule);}
  .scalc .sc-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(min(100%,22rem),1fr));
    align-items: stretch;
    gap: 1.55rem 2rem;
  }
  .scalc .sc-offer {border-top: 2px solid var(--sc-ink);}
  .scalc .sc-offer-head {min-height: 2.8rem; margin: var(--space-2xs, .25rem) 0 0;}
  .scalc .sc-offer-head h3 {margin: 0;}
  .scalc .sc-offer-head .sc-btn {min-height: 2.6rem; padding: 0 var(--space-2xs, .25rem); color: var(--sc-brand); border: 0; text-decoration: underline;}

/* Hallmark v2 | Existing First American brand | full redesign | app | market report, closing field guide, service directory */
/* Critique: The city price anchors a report, each closing action follows its stage, and phone numbers align with the offices they reach. */
:root {
  --resource-body:var(--body);
  --resource-pale:var(--pale);
  --resource-mark:color-mix(in srgb,var(--accent) 39%,var(--paper));
  --resource-rule:var(--line);
  --resource-ink:var(--ink);
  --resource-focus:var(--blue);
}
:is([data-section=guide],[data-section=directory],[data-section=market]) {
  color:var(--resource-body);
  font-family:inherit;
}
:is([data-section=guide],[data-section=directory],[data-section=market]) :is(h2,h3,h4) {
  color:var(--resource-ink);
  min-width:0;
  overflow-wrap:break-word;
  text-wrap:balance;
}
:is([data-section=guide],[data-section=directory],[data-section=market]) :is(a,button,select,input):focus-visible {
  outline:3px solid var(--resource-focus);
  outline-offset:3px;
}
:is([data-section=guide],[data-section=directory]) .resource-link {
  font-weight:650;
  text-decoration:underline;
  text-underline-offset:.21em;
  text-decoration-thickness:1px;
}
:is([data-section=guide],[data-section=directory],[data-section=market]) a:hover {text-decoration-thickness:2px;}
:is([data-section=guide],[data-section=directory],[data-section=market]) :is(a,button):active {text-decoration:underline;text-decoration-thickness:2px;}

/* One leading figure and three supporting measures. All bars share a zero baseline. */
[data-section=market] .mk-view {
  --mk-panel:var(--resource-pale);
  --mk-bar:var(--resource-mark);
  --mk-ink:var(--ink);
  --mk-paper:var(--paper);
  --mk-accent:var(--accent);
  --mk-muted:var(--muted);
  --mk-line:var(--resource-rule);
  container:market-page / inline-size;
}
[data-section=market] .mk-report {
  padding:0;
  border:0;
  border-radius:0;
  background:var(--paper);
}
[data-section=market] .mk-listing-note {
  color:var(--accent);
  background:var(--resource-pale);
  border:0;
  padding:.72rem var(--space-md);
  margin:0 0 1.35rem;
}
[data-section=market] .mk-report-head,
[data-section=market] .mk-chart-head {align-items:center;gap:var(--space-md) var(--space-lg);}
[data-section=market] .mk-report-head > div {flex:1 1 19rem;}
[data-section=market] .mk-city,
[data-section=market] .mk-chart-head h3 {
  font-family:inherit;
  font-weight:700;
  line-height:1.12;
  letter-spacing:-.04em;
}
[data-section=market] .mk-city {font-size:clamp(2.05rem,5cqi,3.35rem);}
[data-section=market] .mk-chart-head h3 {font-size:clamp(1.55rem,3.4cqi,2.05rem);}
[data-section=market] .mk-meta,
[data-section=market] .mk-chart-date,
[data-section=market] .mk-chart-note {font-size:.9rem;}
[data-section=market] .mk-field {color:var(--muted);}
[data-section=market] .mk-field select {
  padding:.55rem .8rem;
  min-height:2.7rem;
  min-width:11rem;
  border-radius:.3rem;
  border:1px solid var(--resource-mark);
  background-color:var(--paper);
}
[data-section=market] .mk-metrics {
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  margin:1.4rem 0 0;
  padding:clamp(.95rem,2.5cqi,1.55rem) 0;
  border-top:2px solid var(--accent);
  border-bottom:1px solid var(--resource-rule);
}
[data-section=market] .mk-metrics > div {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--space-sm);
  min-width:0;
  border:0;
  padding:var(--space-xs) .15rem var(--space-xs) clamp(var(--space-md),3cqi,2rem);
}
[data-section=market] .mk-metrics dt {font-weight:550;font-size:.91rem;line-height:1.4;}
[data-section=market] .mk-metrics dd {
  font-family:inherit;
  font-weight:700;
  font-size:clamp(1.2rem,2.9cqi,1.85rem);
  line-height:1.08;

  font-variant-numeric:tabular-nums;
  letter-spacing:-.045em;
}
[data-section=market] .mk-metrics > .mk-primary {
  grid-row:span 3;
  flex-direction:column;
  align-items:flex-start;

}
[data-section=market] .mk-primary dt {color:var(--ink);font-size:1rem;}

}
[data-section=market] .mk-reading {

}

[data-section=market] .mk-pricing {font-size:.96rem;max-width:65ch;}
[data-section=market] .mk-link {
  font-size:.91rem;
  font-weight:650;
  min-height:2.2rem;
  color:var(--accent);
}
[data-section=market] .mk-comparison {
  border-top:1px solid var(--resource-rule);
  margin-top:clamp(1.7rem,4.2cqi,3rem);

}
[data-section=market] .mk-chart-head {margin-bottom:var(--space-md);}
[data-section=market] .mk-table {table-layout:fixed;}
[data-section=market] .mk-table th,
[data-section=market] .mk-table td {padding:.68rem .6rem;}

/* A reading sequence on the left and the working seller checklist beside it. */

[data-section=guide] .guide-packet .primary:hover {text-decoration:underline;}

[data-section=guide] .basic-grid {

[data-section=guide] .basic-grid article:last-child {border-right:0;padding-right:0;}

[data-section=guide] .basic-grid p,
[data-section=guide] .preopen-guide p,

[data-section=guide] .preopen-guide {

[data-section=guide] .preopen-guide .resource-link {display:inline-block;margin-top:.7rem;}

[data-section=guide] .step-list {margin:var(--space-md) 0 0;}

[data-section=guide] .step-number {

[data-section=guide] .step-list .label {

[data-section=guide] .step-list h3 {margin:.18rem 0 0;font-size:1.21rem;}

[data-section=guide] .guide-layout .step-action {

  padding:0 0 0 .7rem;
  border-left:2px solid var(--resource-rule);

}

[data-section=guide] .check-panel {

[data-section=guide] .check-list label {line-height:1.5;padding:.72rem 0;cursor:pointer;}

[data-section=guide] .wire-panel {

@container market-page (max-width:42rem) {

async function lookupListingJurisdiction(location,{consent=false,signal}={}) {
  if (consent !== true) return jurisdictionEmpty("unsupported","Choose the county lookup to send this address to the named county mapping service.");

  const kind = root.hasAttribute("data-sc-net") ? "net" : root.hasAttribute("data-sc-offers") ? "offers" : "waiting";
  function snapshot() {
    return {version:1, kind, listingId:profile?.id ?? null, overrides:[...overrides], data:read()};
  }
  function load(draft) {
    overrides = new Set(Array.isArray(draft?.overrides) ? draft.overrides.filter(key=>key==="price" || key==="location") : []);
    write(draft?.data);
  }
  function update() {
    if (profile) defaults(profile, overrides);
    const reference = root.querySelector("[name=property]");
    if (reference) {
      reference.readOnly = !!profile;
      reference.closest("label").firstElementChild.textContent = profile ? "Listing address" : (kind === "net" ? "Property address" : "Property / listing reference");
    }
    const text = scListingText(profile);
    for (const caption of root.querySelectorAll("[data-sc-listing]")) {
      caption.textContent = text;
      caption.hidden = !text;
    }
    const locationHelp = root.querySelector("[data-sc-confirm-location]");
    if (locationHelp) locationHelp.hidden = !profile || !!profile.taxLocation;
    refresh();
    el.dispatchEvent(new CustomEvent("listingworksheetchange",{bubbles:true}));
  }
  function recordOverride(event) {
    if (profile && ["price","location"].includes(event.target.name)) overrides.add(event.target.name);
  }
  root.addEventListener("input",recordOverride);
  root.addEventListener("change",recordOverride);
  const api = {
    getListing:()=>profile,
    snapshot,
    restore(draft) {
      if (draft?.version!==1 || draft.kind!==kind || draft.listingId!==(profile?.id ?? null) || !draft.data || typeof draft.data!=="object") return false;
      load(draft);update();return true;
    },
    setListing(raw) {
      const next = scListingProfile(raw);
      const previousId = profile?.id ?? null;
      const nextId = next?.id ?? null;
      if (nextId !== previousId) {
        drafts.set(previousId,snapshot());
        load(drafts.get(nextId));
      }
      profile = next;
      update();
    },
    startBlank() {
      load(null);
      overrides.add("price");
      update();
    }
  };
  scControllers.set(el,api);
  return api;
}
function scApplyLocation(container, loc) {
  const meaning = container.querySelector(".sc-location-meaning");
  if (meaning) {

  container.querySelectorAll("[data-show]").forEach(label => {
    const show = {city:loc === "sac-city", county:!!loc && loc !== "manual", manual:loc === "manual"}[label.dataset.show];
    label.hidden = !show;
    label.querySelector("input").disabled = !show;
  });
}
function scValidation(container, values, fallback) {
  const invalid = [...container.querySelectorAll("input, select")].find(control => !control.disabled && !control.validity.valid);
  if (invalid) {
    if (invalid.validity.valueMissing) {
      if (invalid.name === "location") return "Select a property location.";
      if (invalid.name === "price") return "Enter a sale or offer price.";
      if (invalid.name === "manualTax") return "Enter the quoted seller transfer tax, including $0 if exempt.";
    }
    if (invalid.validity.customError) return invalid.validationMessage;
    const label = invalid.closest("label")?.firstElementChild?.textContent || fallback;
    return 'Check the value for ' + label.toLowerCase() + '.';
  }
  if (Number(values.assumed) > Number(values.price)) return "Buyer-assumed debt exceeds the price.";
  if (Number(values.deposit) > Number(values.price)) return "The deposit exceeds the offer price.";
  return "";
}

function sheetAdjustments(values) {
  const days = (end,start) => end && start ? Math.round((Date.parse(end)-Date.parse(start))/86400000) : 0;
  const interestDays = Math.max(0,days(values.closeDate,values.interestThrough));
  const dailyInterest = (Number(values.primaryLoan||0)*Number(values.primaryRate||0)+Number(values.secondaryLoan||0)*Number(values.secondaryRate||0))/36500;
  const tax = scCents(Number(values.annualTaxes||0)*days(values.closeDate,values.taxThrough)/365);
  const interest = scCents(interestDays*dailyInterest);
  return {interest,tax};
}
function sheetEstimate(values) {
  const primary = scCents(values.primaryLoan), secondary = scCents(values.secondaryLoan);
  const combined = values.payoff !== "";
  const adjustments = sheetAdjustments(values);
  const concessions = values.concessionUnit === "percent" ? scPercent(scCents(values.price),values.concessions)/100 : values.concessions;
  const base = sellerEstimate({...values,payoff:0},{...values,concessions});
  const loans = combined ? [["Combined loan / lien payoff",scCents(values.payoff)]] : [["Primary loan balance",primary],["Secondary loan balance",secondary]];
  const costs = [...base.items.filter(([label])=>label!=="Loan and lien payoffs"),
    ...sheetFees.map(([key,label])=>[label,scCents(values[key])]),["Accrued loan interest",adjustments.interest]];
  const closingCosts = costs.reduce((sum,[,cents])=>sum+cents,0);
  const tax = adjustments.tax;
  const items = [...loans, ...costs, [tax < 0 ? "Prorated tax credit" : "Prorated tax debit",tax]];
  const total = items.reduce((sum,[,cents])=>sum+cents,0);
  return {...base, net:base.price-total, total, items, loans, tax, closingCosts};
}
function drawSheet(root, result, combined) {
  const rows = [["Sales price",result?.price,"#e5eafa"],...(result?.loans || (combined ? [["Combined loan / lien payoff",null]] : [["Primary loan balance",null],["Secondary loan balance",null]])).map(([label,val],index)=>[label,val,index ? "#a1cf71" : "#60a728"]),
    [result?.tax < 0 ? "Prorated tax credit" : result?.tax > 0 ? "Prorated tax debit" : "Prorated property tax",result ? Math.abs(result.tax) : null,"#92749b"],
    ["Closing costs and adjustments",result?.closingCosts,"#f6b522"],[result?.net < 0 ? "Cash needed to close" : "Net at close",result?.net,"#638afb"]];
  root.querySelector("[data-legend]").innerHTML = rows.map(([label,cents,color])=>'<div><dt><i style="background:'+color+'"></i>'+label+'</dt><dd>'+(cents==null ? '—' : scDollars(Math.abs(cents))+(label==="Closing costs and adjustments" && cents<0 ? ' credit' : ''))+'</dd></div>').join("");
  const ring = root.querySelector(".sheet-ring");
  const slices = result ? [[result.net,"#638afb"],[result.closingCosts,"#f6b522"],[result.tax,"#92749b"],
    ...result.loans.map(([,cents],index)=>[cents,index ? "#a1cf71" : "#60a728"]).reverse()].filter(([value])=>value>0) : [];
  const total = slices.reduce((sum,[value])=>sum+value,0);
  let angle = 0;
  ring.style.setProperty("--segments", total ? 'conic-gradient('+slices.map(([value,color])=>{
    const start = angle; angle += value/total*360;
    const gap = Math.min(1,(angle-start)/4);
    return color+' '+start+'deg '+(angle-gap)+'deg, white '+(angle-gap)+'deg '+angle+'deg';
  }).join(",")+')' : '#e7ecf6');
}

    '<p class="sc-note" data-feedback aria-live="polite"></p><div class="sc-scroll" role="region" tabindex="0" aria-label="Offer comparison"></div>' +
    scPrintButton("Print / save comparison") + '</section><p class="sc-fine">' + scDisclaimer + '</p></div>';
  const root = el.querySelector("[data-sc-offers]");
  const commonEl = root.querySelector(".sc-common");
  const cards = root.querySelector(".sc-cards");
  const print = root.querySelector("[data-action=print]");
  let id = 0;
  let report = null;
  let controller;
  function add() { cards.insertAdjacentHTML("beforeend", scOfferCard(++id)); }
  function refresh() {
    const location = commonEl.querySelector("[name=location]").value;
    scApplyLocation(root, location);
    const common = scValues(commonEl);
    common.taxBasis = scShowTaxBasis(root,controller?.getListing(),common.location);
    common.listingLabel = scListingText(controller?.getListing());
    const sharedError = scValidation(commonEl, common, "shared details");
    const records = [...cards.children].map(card => {
      const offer = scValues(card);
      const name = offer.name.trim() || "Offer " + card.dataset.offer;
      const error = scValidation(card, offer, "offer details");
      const result = error || sharedError ? null : sellerEstimate(common, offer);
      card.querySelector("[data-offer-net]").textContent = result ? scDollars(result.net) : "—";
      return {name, offer, error, result};
    });
    const firstInvalid = records.find(r => r.error);
    const feedback = sharedError || (firstInvalid ? firstInvalid.name + ' · ' + firstInvalid.error : '');
    root.querySelector("[data-feedback]").textContent = feedback || "A negative net is the estimated amount the seller would bring to closing.";
    print.disabled = !!feedback;
    cards.querySelectorAll("[data-action=remove]").forEach(b => b.disabled = records.length <= 2);
    root.querySelector(".sc-scroll").innerHTML = scComparisonTable(records);
    report = feedback ? null : {common, records};
  }
  root.addEventListener("input", refresh);
  root.addEventListener("change", refresh);
  root.addEventListener("click", event => {
    const control = event.target.closest("button[data-action]");
    if (!control || control.disabled) return;
    if (control.dataset.action === "add") {
      add();
      refresh();
      cards.lastElementChild.querySelector("input").focus();
    }
    if (control.dataset.action === "remove") {
      control.closest(".sc-offer").remove();
      refresh();
      root.querySelector("[data-action=add]").focus();
    }
    if (control.dataset.action === "print" && report) {
      const {common, records} = report;
      const tables = [];
      for (let i = 0; i < records.length; i += 3) {
        const group = records.slice(i, i + 3);
        tables.push(scComparisonTable(group, records));
      }
      const breakdown = records.map(r => '<section class="sc-printoffer"><h2>' + scEscape(r.name) + '</h2><dl class="sc-lines"><div><dt>Offer price</dt><dd>' + scDollars(r.result.price) +
        '</dd></div>' + scCostLines(r.result) + scNetTotal(r.result) + '</dl></section>');
      scPrint("Multiple offer comparison", common, tables.join("") + breakdown.join(""));
    }
  });
  controller = scWorksheetController(el,root,
    () => ({fields:scDraftFields(commonEl),offers:[...cards.children].map(card=>({id:Number(card.dataset.offer),fields:scDraftFields(card)}))}),
    draft => {
      scRestoreFields(commonEl,draft?.fields);
      cards.replaceChildren();
      id=0;
      const stored = Array.isArray(draft?.offers) ? draft.offers : [];
      for (const item of stored) {
        if (Number.isSafeInteger(item?.id) && item.id > id && item.id < Number.MAX_SAFE_INTEGER) id=item.id-1;
        add();scRestoreFields(cards.lastElementChild,item?.fields);
      }
      while (cards.childElementCount<2) add();
    },
    (profile,overrides) => {
      commonEl.querySelector("[name=property]").value = profile.label;
      if (!overrides.has("location")) commonEl.querySelector("[name=location]").value = profile.taxLocation;
    },
    refresh);
  add();add();
  refresh();
  return controller;
}

const marketMoney = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const marketNum = new Intl.NumberFormat("en-US");
const marketMetrics = {
  medianListPrice: { label: "Median list price", format: n => marketMoney.format(n) },
  inventory: { label: "Homes listed", format: n => marketNum.format(n) },
  medianDaysOnMarket: { label: "Median days on market", format: n => marketNum.format(n) },
  priceDecreasedPct: { label: "Listings with price cuts", format: n => n + "%" },
  marketActionIndex: { label: "Market Action Index", format: n => marketNum.format(n) },
  pricePerSqFt: { label: "Asking price per square foot", format: n => marketMoney.format(n) }
};

/** Render a dated Altos city snapshot and city comparison from market.json. */
function mountMarket(el, data) {
  const markets = data.markets;
  el.replaceChildren();
  const widget = document.createElement("div");
  widget.className = "mk-view";
  el.append(widget);
  if (!markets.length) {
    widget.textContent = "Local market reports are currently unavailable.";
    return () => {};
  }
  const date = new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric", year: "numeric", timeZone: "UTC" }).format(new Date(data.asOf + "T00:00:00Z"));
  widget.innerHTML = `
    <div class="mk-report">
      <p class="mk-listing-note" role="status" hidden></p>
      <header class="mk-report-head">
        <div><h3 class="mk-city"></h3>
          <p class="mk-meta"></p>
        </div>
        <label class="mk-field"><span>Choose a city</span><select class="mk-city-pick"></select></label>
      </header>
      <dl class="mk-metrics"></dl>
      <div class="mk-reading">
        <div><h4>What this means for pricing</h4><p class="mk-pricing"></p></div>
        <a class="mk-link" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
    <div class="mk-comparison">
      <div class="mk-chart-head">
        <div><h3>Compare local markets</h3><p class="mk-chart-date"></p></div>
        <label class="mk-field"><span>Compare by</span><select class="mk-metric-pick"></select></label>
      </div>
      <table class="mk-table">
        <caption class="mk-sr"></caption>
        <thead><tr><th scope="col">City</th><th scope="col" class="mk-metric-heading"></th></tr></thead>
        <tbody></tbody>
      </table>
      <p class="mk-chart-note"></p>
    </div>
    <p class="mk-sr mk-announcement" role="status"></p>`;

  const lookup = selector => widget.querySelector(selector);
  const cityPick = lookup(".mk-city-pick");
  const metricPick = lookup(".mk-metric-pick");
  const chooser = new Option("Select a comparison city", "");
  chooser.hidden = true;
  cityPick.add(chooser);
  for (const m of markets) cityPick.add(new Option(m.city, m.city));
  cityPick.value = markets[0].city;
  for (const [key, metric] of Object.entries(marketMetrics)) metricPick.add(new Option(metric.label, key));
  let listing = null;
  let matchedCity = "";

  function renderChart() {
    const key = metricPick.value;
    const metric = marketMetrics[key];
    const sorted = [...markets].sort((a, b) => b[key] - a[key] || a.city.localeCompare(b.city));
    const max = Math.max(...sorted.map(m => m[key]));
    lookup(".mk-metric-heading").textContent = metric.label;
    lookup(".mk-table caption").textContent = metric.label + " by city, single-family houses, " + date;
    const body = lookup(".mk-table tbody");
    body.replaceChildren();
    for (const market of sorted) {
      const row = body.insertRow();
      row.classList.toggle("mk-selected", market.city === cityPick.value);
      const name = document.createElement("th");
      name.scope = "row";
      name.textContent = market.city;
      row.append(name);
      const value = row.insertCell();
      value.innerHTML = '<div class="mk-value"><span class="mk-track" aria-hidden="true"><span></span></span><span class="mk-value-text"></span></div>';
      value.querySelector(".mk-track span").style.width = (max > 0 ? market[key] / max * 100 : 0) + "%";
      value.querySelector(".mk-value-text").textContent = metric.format(market[key]);
    }
    const notes = {
      medianListPrice: "Half of the listed houses have an asking price above the median and half below.",
      inventory: "Inventory counts houses on the market in each city. Larger cities can have more listings simply because they have more homes.",
      medianDaysOnMarket: "This measures how long currently listed houses have been on the market.",
      priceDecreasedPct: "The share of active listings whose asking price has been reduced.",
      marketActionIndex: "Altos compares the pace of sales with available inventory. A reading above 30 generally favors sellers.",
      pricePerSqFt: "Asking prices per square foot vary with the mix of homes currently for sale."
    };
    lookup(".mk-chart-note").textContent = notes[key];
  }

  function renderReport() {
    const m = markets.find(item => item.city === cityPick.value);
    const note = lookup(".mk-listing-note");
    const name = listing && String(listing.city || "").trim();
    note.hidden = !listing;
    note.textContent = "";
    if (listing) {
      if (!matchedCity) {
        note.textContent = (name ? "This desk has no matched city report for " + name + "." : "This listing has no matched city report.") +
          (m ? " Showing " + m.city + " for comparison." : " Select a city to see its figures.");
      } else {
        note.textContent = m && m.city === matchedCity ? "Showing the citywide report for this listing." :
          "Listing market: " + matchedCity + ". Showing " + m.city + " for comparison.";
      }
    }
    lookup(".mk-metrics").hidden = !m;
    lookup(".mk-reading").hidden = !m;
    if (!m) {
      lookup(".mk-city").textContent = "Choose a comparison market";
      lookup(".mk-meta").textContent = "Citywide single-family house reports";
      lookup(".mk-metrics").replaceChildren();
      lookup(".mk-pricing").textContent = "";
      lookup(".mk-link").removeAttribute("href");
      lookup(".mk-link").replaceChildren();
      renderChart();
      return;
    }
    lookup(".mk-city").textContent = m.city;
    lookup(".mk-meta").textContent = (listing && m.city !== matchedCity ? "Comparison market" : "City market snapshot") + " for single-family houses in " + m.county + " County. " + date + ".";
    const stats = lookup(".mk-metrics");
    stats.replaceChildren();
    for (const key of ["medianListPrice", "inventory", "medianDaysOnMarket", "marketActionIndex"]) {
      const item = document.createElement("div");
      const label = document.createElement("dt");
      label.textContent = marketMetrics[key].label;
      const value = document.createElement("dd");
      value.textContent = marketMetrics[key].format(m[key]);
      item.append(label, value);
      if (key === "medianListPrice") item.className = "mk-primary";
      stats.append(item);
    }
    lookup(".mk-pricing").textContent = "In " + m.city + ", " + m.priceDecreasedPct + "% of listed houses had a price cut. Use the " + marketMoney.format(m.medianListPrice) + " median asking price as context, then check recent closed sales for homes like the seller’s.";
    const link = lookup(".mk-link");
    link.href = m.url;
    link.textContent = "Latest " + m.city + " report";
    renderChart();
  }
  lookup(".mk-chart-date").textContent = "Altos Research figures for single-family houses, " + date + ".";
  cityPick.addEventListener("change", () => {
    renderReport();
    lookup(".mk-announcement").textContent = cityPick.value ? cityPick.value + " market snapshot selected." : "Choose a comparison market.";
  });
  metricPick.addEventListener("change", () => {
    renderChart();
    lookup(".mk-announcement").textContent = "Comparing " + marketMetrics[metricPick.value].label.toLowerCase() + " across " + markets.length + " cities.";
  });
  renderReport();
  return profile => {
    listing = profile || null;
    const requested = String(profile?.marketCity || "").trim().toLowerCase();
    matchedCity = markets.find(m => m.city.toLowerCase() === requested)?.city || "";
    chooser.hidden = !profile || !!matchedCity;
    cityPick.value = profile ? matchedCity : markets[0].city;
    renderReport();
  };
}

function viewEscape(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
}
function sourceAnchor(source, label) {
  return '<a class="resource-link" href="' + viewEscape(source.url) + '" target="_blank" rel="noopener noreferrer">' + viewEscape(label || source.name) + '</a>';
}
function mountGuide(el, data) {

  el.innerHTML = '<section class="guide-listing" hidden><h2></h2><p></p><div class="guide-parcel-links"></div></section>' + packet + '<section class="basic-grid" aria-label="Title and escrow basics">' + basicCards + '</section>' + preopen +
    '<div class="guide-layout"><section><h2>The closing process</h2><ol class="step-list">' + steps + '</ol></section>' +
    '<aside><section class="check-panel"><h2>Seller checklist</h2><div class="check-status"><span class="check-progress" aria-live="polite"></span><progress aria-label="Seller checklist progress" max="' + data.checklist.length + '" value="0"></progress></div><div class="check-list">' + checks + '</div></section>' +
    identity + '<section class="wire-panel"><h3>' + viewEscape(data.wireSafety.title) + '</h3><p>' + viewEscape(data.wireSafety.body) + '</p>' + sourceAnchor(data.sources.wire, "Wire safety guide") + '</section></aside></div>' +
    '<section class="reading guide-reading"><h2>Seller handouts and reference</h2><div class="guide-resource-groups"><div><h3>For the move</h3>' + [data.sources.movingGuide,data.sources.reminders].map(s => sourceAnchor(s)).join("") +
    '</div><div><h3>Title and escrow questions</h3>' + [data.sources.commonTitle,data.sources.escrow,data.sources.portal].map(s => sourceAnchor(s)).join("") +
    '</div><div><h3>Spanish-language resources</h3><div lang="es">' + sourceAnchor(data.sources.spanishFaq, "Preguntas frecuentes sobre el seguro de título (PDF)") + '</div>' +
    sourceAnchor(data.sources.profile, data.sellerGuide.spanishRequest) + '</div></div></section>';
  const boxes = [...el.querySelectorAll("[data-task]")];
  function progress() {
    const count = boxes.filter(b=>b.checked).length;
    el.querySelector(".check-progress").textContent = count + " of " + boxes.length + " complete";
    el.querySelector(".check-status progress").value = count;
  }
  el.addEventListener("change", progress);
  progress();
  const context = el.querySelector(".guide-listing");
  return profile => {
    context.hidden = !profile;
    const parcelLinks = context.querySelector(".guide-parcel-links");
    parcelLinks.replaceChildren();
    if (!profile) {
      context.querySelector("h2").textContent = "";
      context.querySelector("p").textContent = "";
      return;
    }
    const location = String(profile.street || profile.address || profile.city || "this listing").trim();
    context.querySelector("h2").textContent = "Title review for " + location;
    const outOfState = profile.state && !["ca", "california"].includes(String(profile.state).trim().toLowerCase());
    context.querySelector("p").textContent = outOfState ?
      "This guide covers California closings. Ask the local closing team which documents and deadlines apply to this property." :
      "Before requesting a preliminary report, confirm the parcel number, recording county and names on title with the title team. Ask who must sign if a trust, estate or other entity holds title.";
    for (const item of profile.parcelLinks || []) {
      let url;
      try { url = new URL(item.url); } catch { continue; }
      if (url.protocol !== "https:") continue;
      const link = document.createElement("a");
      link.className = "resource-link";
      link.href = url.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = String(item.label || "County parcel records");
      parcelLinks.append(link);
    }
  };
}
function mountDirectory(el, data) {
  const counties = [...new Set(data.directory.map(d => d.county))].sort();
  const categories = [...new Set(data.directory.map(d => d.category))].sort();
  const options = list => list.map(value => '<option>' + viewEscape(value) + '</option>').join("");
  el.innerHTML = '<p class="dir-listing" role="status" hidden></p><div class="dir-filters"><label>Search contacts<input type="search" placeholder="Office, city or service" data-dir="search"></label>' +
    '<label>County<select data-dir="county"><option value="">All counties</option>' + options(counties) + '</select></label>' +
    '<label>Service<select data-dir="category"><option value="">All services</option>' + options(categories) + '</select></label></div>' +
    '<div class="dir-count" role="status"></div><div class="dir-list"></div><p class="dir-note">' + viewEscape(data.directoryNote) + '</p>' +
    '<div class="directory-bottom">' + sourceAnchor(data.sources.office, "Find another First American office") + '</div>';
  const field = name => el.querySelector('[data-dir="' + name + '"]');
  const list = el.querySelector(".dir-list");
  const context = el.querySelector(".dir-listing");
  function filter() {
    const words = field("search").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    const rows = data.directory.filter(d => (!field("county").value || d.county === field("county").value) && (!field("category").value || d.category === field("category").value)
      && words.every(w => [d.county,d.category,d.name,d.location,d.description].join(" ").toLowerCase().includes(w)));
    el.querySelector(".dir-count").textContent = rows.length + (rows.length === 1 ? " contact" : " contacts");
    if (!rows.length) {
      list.innerHTML = '<div class="empty-dir"><h3>No contacts match those filters.</h3><button class="text-button" type="button" data-clear>Clear filters</button></div>';
      return;
    }
    const groups = new Map();
    for (const row of rows) {
      if (!groups.has(row.category)) groups.set(row.category,[]);
      groups.get(row.category).push(row);
    }
    list.innerHTML = [...groups].map(([category, contacts]) =>
      '<section class="dir-group"><h2>' + viewEscape(category) + '</h2><div class="dir-contacts">' +
      contacts.map(d => '<article><div class="dir-description"><h3>' + viewEscape(d.name) + '</h3><p>' + viewEscape(d.description) +
        '</p></div><div class="dir-place"><div>' + viewEscape(d.county) + ' County</div>' +
        (d.location !== d.county + " County" ? '<p class="dir-location">' + viewEscape(d.location) + '</p>' : '') +
        '</div><div class="dir-actions">' + (d.phone ? '<a aria-label="' + viewEscape("Call " + d.name + " at " + d.phone) + '" href="tel:' +
        d.phone.replace(/[^0-9+]/g,"") + '">' + viewEscape(d.phone) + '</a>' : "") +
        '<a class="resource-link" target="_blank" rel="noopener noreferrer" aria-label="' + viewEscape(d.name + " website") + '" href="' + viewEscape(d.url) + '">Website</a></div></article>').join("") +
      '</div></section>').join("");
  }
  field("search").addEventListener("input", filter);
  field("county").addEventListener("change", filter);
  field("category").addEventListener("change", filter);
  el.addEventListener("click", e => {
    if (e.target.closest("[data-clear]")) {
      ["search","county","category"].forEach(k => field(k).value = "");
      filter();
      field("search").focus();
    }
  });
  filter();
  return profile => {
    const rawCounty = String(profile?.county || "").trim().replace(/\s+county$/i, "").toLowerCase();
    const county = counties.find(c => c.toLowerCase() === rawCounty) || "";
    field("county").value = county;
    field("category").value = "";
    field("search").value = "";
    context.hidden = !profile;
    context.textContent = county ?
      county + " County is the suggested service area for this listing. Confirm the property’s recording county with title." :
      "Choose a county to browse area contacts. Confirm the recording county and utility providers for the property address.";
    filter();
  };
}

const waitCosts = [
  {key:"interest", label:"Mortgage interest", months:12},
  {key:"hoa", label:"HOA dues", months:12},
  {key:"upkeep", label:"Utilities and upkeep", months:12},
  {key:"other", label:"Other ongoing expenses", months:12},
  {key:"tax", label:"Annual property tax", months:1},
  {key:"insurance", label:"Annual insurance premium", months:1}
];

function mountWaiting(el) {
  if (el.querySelector(".wait-calc") && scControllers.has(el)) return scControllers.get(el);
  const moneyField = (name, label, options = {}) => scNumber(name, label, {max:"999999999", ...options});
  const fields = (multiplier) => scGrid(waitCosts.filter(c => c.months === multiplier).map(c => moneyField(c.key, c.label)));
  el.innerHTML = '<div class="scalc wait-calc"><div class="sc-layout">'+
    '<section class="sc-entry"><h2>Time Between Closings</h2>'+scGrid([scNumber("days","Additional days of ownership",{unit:"days",min:"0",step:"1",max:"3660",value:"30",required:true})])+
    '<h3>Monthly Expenses</h3>'+fields(12)+
    '<p class="sc-note">Use the interest portion of the mortgage payment. Principal payments reduce the outstanding loan balance.</p>'+
    '<h3>Annual Expenses</h3>'+fields(1)+
    '<p class="sc-note">Enter each expense once, including amounts the lender collects through an escrow account.</p>'+
    '<h3>Price Comparison</h3>'+
    scGrid([moneyField("gain","Expected change in seller net before holding costs",{min:"-999999999",placeholder:"Optional"})])+
    '<p class="sc-note">Subtract the sooner sale’s estimated net from the later sale’s estimated net. A negative number means the later sale already nets less. Use the same payoff assumptions in both estimates and leave out costs counted here.</p>'+
    '<a class="resource-link" href="#offers">Compare offer nets</a></section>'+
    '<aside class="sc-result" aria-label="Holding cost estimate"><div class="sc-result-top"><p>Estimated cost of waiting</p><strong data-wait-total aria-live="polite">—</strong><span data-wait-help></span>'+scListingCaption+'</div>'+
    '<div class="wait-output" hidden><dl class="wait-lines" data-wait-lines></dl><p class="wait-insight" data-wait-insight></p>'+
    '<dl class="wait-lines wait-print-only" data-wait-assumptions></dl>'+
    '<button type="button" class="primary wait-print">Print / save worksheet</button></div></aside></div>'+
    '<p class="sc-fine">Planning estimate. Monthly costs are multiplied by 12 and divided by 365 for a daily average. Blank expense fields count as $0. Actual bills, interest and closing prorations may differ.</p>'+
    '<details class="wait-example"><summary>See a worked example</summary><p>A seller pays $1,200 a month in mortgage interest, $6,000 a year in property tax and $1,500 a year in insurance. That averages $60 a day. Another 30 days costs about $1,800. If the later sale nets $2,500 more before those costs, the seller is ahead by about $700.</p></details>'+
    '<p class="sc-source"><a href="https://www.consumerfinance.gov/ask-cfpb/how-does-paying-down-a-mortgage-work-en-1943/" target="_blank" rel="noopener noreferrer">CFPB guide to mortgage principal and interest</a></p></div>';
  const entry = el.querySelector(".sc-entry");
  const field = key => entry.querySelector('[name="'+key+'"]');
  const lines = rows => rows.map(([label,value]) => "<div><dt>"+scEscape(label)+"</dt><dd>"+scEscape(value)+"</dd></div>").join("");
  function refresh() {
    const invalid = [...entry.querySelectorAll("input")].find(input => !input.validity.valid);
    const started = waitCosts.some(c => field(c.key).value !== "");
    const ready = started && !invalid;
    el.querySelector(".wait-output").hidden = !ready;
    const help = el.querySelector("[data-wait-help]");
    const total = el.querySelector("[data-wait-total]");
    if (!ready) {
      total.textContent = "—";
      help.textContent = invalid ? "Check the amount or day count for "+invalid.closest("label").firstElementChild.textContent.toLowerCase()+"." : "Enter an expense to see the cost for the extra days. Enter 0 if there is no carrying cost.";
      return;
    }
    const days = Number(field("days").value);
    const annual = waitCosts.reduce((sum,c) => sum + scCents(field(c.key).value) * c.months, 0);
    const cost = Math.round(annual * days / 365);
    const dayLabel = days === 1 ? "1 extra day" : days+" extra days";
    total.textContent = scDollars(cost);
    help.textContent = "For "+dayLabel+" of ownership";
    const rows = [["Average monthly cost",scDollars(Math.round(annual/12))],["Average daily cost",scDollars(Math.round(annual/365))],["Extra net needed to break even",scDollars(cost)]];
    const gain = field("gain").value;
    let message = "A later closing would need to bring in "+scDollars(cost)+" more in net proceeds to cover the extra ownership costs.";
    if (gain !== "") {
      const difference = scCents(gain) - cost;
      rows.push(["Expected change before holding costs",scDollars(scCents(gain))],["Change after holding costs",scDollars(difference)]);
      message = difference === 0 ? "The two timing options break even with these estimates." : "After holding costs, the later sale leaves the seller "+scDollars(Math.abs(difference))+(difference>0 ? " ahead." : " behind.");
    }
    el.querySelector("[data-wait-lines]").innerHTML = lines(rows);
    el.querySelector("[data-wait-insight]").textContent = message;
    el.querySelector("[data-wait-assumptions]").innerHTML = lines(waitCosts.map(c => [c.label+(c.months===12?" (per month)":""),scDollars(scCents(field(c.key).value))]));
  }
  entry.addEventListener("input",refresh);
  entry.addEventListener("change",refresh);
  el.querySelector(".wait-print").addEventListener("click",() => window.print());
  const controller = scWorksheetController(el,el.querySelector(".wait-calc"),
    () => ({fields:scDraftFields(entry)}),
    draft => scRestoreFields(entry,draft?.fields),
    () => {},
    refresh);
  refresh();
  return controller;
}

function createDeskProfile(raw, askingPrice, location) {

function mountParcelCheck(net, getListing, applyResult) {
  const panel = document.createElement("section");
  panel.className = "parcel-check";
  panel.hidden = true;
  panel.innerHTML = '<strong>Check the transfer-tax location</strong><p data-parcel-range hidden></p><p data-parcel-explain></p>'+
    '<button class="ghost" type="button" data-parcel-lookup></button>'+
    '<p class="parcel-result" role="status" aria-live="polite"></p><button class="primary" type="button" data-use-parcel hidden></button>';
  net.querySelector("[data-sc-confirm-location]").after(panel);
  const search = panel.querySelector("[data-parcel-lookup]");
  const use = panel.querySelector("[data-use-parcel]");
  const message = panel.querySelector(".parcel-result");
  let pending = null;
  let suggestion = null;
  function compareBoundaries() {
    const summary = panel.querySelector("[data-parcel-range]");
    const profile = getListing();
    const price = net.querySelector("[name=price]");
    const debt = net.querySelector("[name=assumed]");
    const unresolved = profile?.status === "matched" && profile.city === "Sacramento" && !net.querySelector("[name=location]").value;
    summary.hidden = !unresolved || !price.value || !price.validity.valid || !debt.validity.valid || Number(debt.value)>Number(price.value);
    if (summary.hidden) {summary.textContent="";return;}
    const taxes = sellerEstimate({location:"sac-city",countyShare:100,cityShare:100},{price:price.value,assumed:debt.value});
    summary.textContent = "At this price, the county transfer tax is "+scDollars(taxes.countyTax)+". Inside Sacramento city limits, the city tax adds "+scDollars(taxes.cityTax)+". These are the full charges before allocating the seller’s share.";
  }
  net.querySelector(".sc-entry").addEventListener("input",compareBoundaries);
  net.querySelector(".sc-entry").addEventListener("change",compareBoundaries);
  function reset() {
    pending?.abort();
    pending = null;
    suggestion = null;
    message.textContent = "";
    use.hidden = true;
    search.disabled = false;
    const profile = getListing();
    compareBoundaries();
    const provider = profile && jurisdictionProvider(profile);
    panel.hidden = !provider;
    if (!provider) return;
    panel.querySelector("[data-parcel-explain]").textContent =
      (profile.city === "Sacramento" ? "A Sacramento mailing address can be inside or outside city limits. " : "") +
      "This optional search sends the street address and mailing area to " + provider.name + ".";
    search.textContent = "Look up the address";
  }
  search.addEventListener("click", async () => {
    const profile = getListing();
    if (!profile || pending) return;
    const request = new AbortController();
    pending = request;
    suggestion = null;
    search.disabled = true;
    use.hidden = true;
    message.textContent = "Checking county records…";
    try {
      const result = await lookupListingJurisdiction(profile,{consent:true,signal:request.signal});
      if (pending !== request || profile !== getListing()) return;
      message.textContent = result.message;
      const preset = scLocations.find(([key])=>key===result.preset);
      if (result.status === "matched" && preset && ["placer","sac-city","sac-county"].includes(preset[0])) {
        suggestion = {profile, result};
        use.textContent = "Use " + preset[1];
        use.hidden = false;
      }
    } catch {
      if (pending === request) message.textContent = "County records could not be reached. Choose the property location above or try again.";
    } finally {
      if (pending === request) { pending = null; search.disabled = false; }
    }
  });
  use.addEventListener("click", () => {
    if (!suggestion || suggestion.profile !== getListing()) return;
    applyResult(suggestion.result);
    use.hidden = true;
    suggestion = null;
    message.textContent = "County record applied to the net sheet.";
  });
  return reset;
}

  }

  const policy = panel.querySelector("[data-owner-policy]");
  const share = panel.querySelector("[data-owner-share]");
  const escrowShare = panel.querySelector("[data-escrow-share]");
  const loanCount = panel.querySelector("[data-fee-loans]");
  for (const select of [share,escrowShare]) {
    for (const [key,label] of [["","Enter amount in closing costs"],["100","100% · Seller pays all"],["50","50% · Split equally"],["0","0% · Buyer pays all"]]) select.add(new Option(label,key));
  }
  const premium = panel.querySelector("[data-premium-label]");
  const description = panel.querySelector("[data-premium-description]");
  const note = panel.querySelector("[data-owner-status]");
  const printNote = panel.querySelector("[data-rate-print]");
  const effective = window.LocalResaleRates.coverage;
  const fmt = new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
  const guideDates = "Guide dates — title "+fmt.format(new Date(effective.titleEffective+"T00:00:00Z"))+" · escrow "+fmt.format(new Date(effective.guideEscrowEffective+"T00:00:00Z"))+".";
  panel.querySelector("[data-rate-dates]").textContent = guideDates;
  const price = entry.querySelector("[name=price]");
  const title = entry.querySelector("[name=title]");
  const escrow = entry.querySelector("[name=escrow]");
  const location = entry.querySelector("[name=location]");
  let writing = false;
  function assign(input,selector,total) {
    if (selector.value === "") return null;
    const amount = total === null ? "" : String(Math.round(total*Number(selector.value))/100);
    if (input.value !== amount) {
      input.value = amount;
      input.dispatchEvent(new Event("input",{bubbles:true}));
    }
    return amount === "" ? null : scMoney.format(Number(amount));
  }
  function render() {
    if (writing) return;
    const listing = getListing();
    const selectedCounty = location.value === "placer" ? "Placer" : ["sac-city","sac-county"].includes(location.value) ? "Sacramento" : "";
    const candidates = listing?.counties || [];
    const county = selectedCounty || listing?.county || (candidates.length && !listing.otherCountyCandidates?.length ? candidates[0] : "");
    panel.hidden = !listing || !["Sacramento","Placer"].includes(county);
    const rates = panel.hidden ? null : window.LocalResaleRates.estimate({county,price:Number(price.value),policy:policy.value,loanCount:Number(loanCount.value)});
    const full = Number.isFinite(rates?.ownersTitle) ? rates.ownersTitle : null;
    const fullEscrow = Number.isFinite(rates?.escrowTotal) ? rates.escrowTotal : null;
    const amounts = [];
    if (full !== null) amounts.push(scMoney.format(full)+" title");
    if (fullEscrow !== null) amounts.push(scMoney.format(fullEscrow)+" escrow");
    premium.textContent = amounts.join(" · ");
    const source = panel.querySelector("[data-rate-source]");
    source.href = window.LocalResaleRates.sources.guide;
    description.textContent = !amounts.length ? "Enter a residential resale price up to $5 million to see the area’s published fees. For other transactions, request a quote." :
      "Full estimates for a one-to-four-family resale at "+scMoney.format(Number(price.value))+", using the sale price as the owner’s policy amount. Select the shares agreed in the contract to include them in seller proceeds.";
    share.disabled = full === null && share.value === "";
    escrowShare.disabled = fullEscrow === null && escrowShare.value === "";
    printNote.textContent = "";
    const notes = [];
    if (listing) {
      writing = true;
      const appliedTitle = assign(title,share,full);
      const appliedEscrow = assign(escrow,escrowShare,fullEscrow);
      writing = false;
      if (appliedTitle !== null) notes.push(policy.selectedOptions[0].text+" "+scMoney.format(full)+", seller share "+share.value+"% ("+appliedTitle+").");
      if (appliedEscrow !== null) notes.push("Basic escrow "+scMoney.format(rates.basicEscrow)+" plus "+scMoney.format(rates.newLoanEscrow)+" in new loan services, seller share "+escrowShare.value+"% ("+appliedEscrow+").");
    }
    const omitted = [];
    if (full !== null && title.value === "") omitted.push("title insurance");
    if (fullEscrow !== null && escrow.value === "") omitted.push("escrow fees");
    const reviewText = omitted.length ? "Seller-paid "+omitted.join(" and ")+" currently count as $0." : "";
    for (const message of [review,quickReview]) {
      message.hidden = !reviewText;
      message.querySelector("span").textContent = reviewText;
    }
    printNote.textContent = [(notes.length ? "First American Region 1 residential resale estimates. "+guideDates+" "+notes.join(" ") : ""),reviewText].filter(Boolean).join(" ");
    const missing = (full === null && share.value !== "") || (fullEscrow === null && escrowShare.value !== "");
    note.textContent = (notes.length ? notes.join(" ")+" " : "") + (missing ? "An unavailable estimate was cleared. Enter a quote in closing costs." : "Obtain a quote for endorsements, recording, additional services, short sales or sales by owner.");
  }
  function onEdit(event) {
    if (writing) return;
    if (event.target === title) share.value = "";
    if (event.target === escrow) escrowShare.value = "";
    if ([price,location,title,escrow,policy,loanCount,share,escrowShare].includes(event.target)) render();
  }
  entry.addEventListener("input",onEdit); entry.addEventListener("change",onEdit);
  return {
    snapshot:()=>({policy:policy.value,share:share.value,loans:loanCount.value,escrowShare:escrowShare.value}),
    restore(saved) {
      policy.value = saved?.policy === "eagle" ? "eagle" : "standard";
      share.value = ["0","50","100"].includes(saved?.share) ? saved.share : "";
      escrowShare.value = ["0","50","100"].includes(saved?.escrowShare) ? saved.escrowShare : "";
      loanCount.value = saved?.loans === "1" ? "1" : "0";
      panel.open = false;
      render();
    },
    render
  };
}
