const sampleInputs = {price:"650000",location:"placer",primaryLoan:"270000",primaryRate:"4",secondaryLoan:"40000",secondaryRate:"6",concessions:"5000",title:"1500",escrow:"950",fees:"375",annualTaxes:"4200",listRate:"2.5",buyerRate:"2",loanType:"Conventional",closeDate:"2026-12-15",taxThrough:"2026-12-31",interestThrough:"2026-12-01",property:"Illustrative Roseville sale"};
const inputRegion = net.querySelector(".sc-entry");
let editing = false;
let estimateState = "sample";
let listing = null;
let enteredDesk = false;
let restoring = false;
let returnRoute = "net";
const taxDrafts = new Map();
function currentTaxBasis() {
  return {taxLocation:listing.taxLocation,taxOrigin:listing.taxOrigin,taxBasis:listing.taxBasis};
}
function readTaxBasis(profile, saved) {
  if (!saved) return;
  const allowed = ["placer","sac-city","sac-county"];
  // Earlier versions stored only explicitly chosen locations. Empty older
  // values allow the new mailing-area estimate on the next visit.
  if (allowed.includes(saved.taxLocation)) {
    profile.taxLocation = saved.taxLocation;
    profile.taxOrigin = ["postal","records","agent"].includes(saved.taxOrigin) ? saved.taxOrigin : "agent";
    profile.taxBasis = typeof saved.taxBasis === "string" && saved.taxBasis ? saved.taxBasis.slice(0,280) : "Transfer-tax location selected by the agent.";
  } else if (saved.taxOrigin === "agent") {
    profile.taxLocation = ""; profile.taxOrigin = "agent"; profile.taxBasis = "";
  }
}
function applyParcelResult(result) {
  if (!listing) return;
  listing.taxLocation = result.preset;
  listing.taxOrigin = "records";
  listing.taxBasis = result.county+" County GIS matched the address to "+result.jurisdiction+". Confirm the parcel and seller allocation with escrow.";
  restoring = true;
  const locationField = net.querySelector("[name=location]");
  locationField.value = result.preset;
  locationField.dispatchEvent(new Event("change",{bubbles:true}));
  Object.values(worksheets).forEach(tool=>tool.setListing(listing));
  restoring = false;
  ownerFees.render();estimateHeading();quickNet();syncPrint();saveDesk();
}
const resetParcelCheck = mountParcelCheck(net,()=>listing,applyParcelResult);
const ownerFees = mountResaleFees(net,()=>listing);
function estimateHeading() {
  net.dataset.exampleState = listing ? "listing" : estimateState;
  if (!listing && net.dataset.exampleState.includes("sample") && !net.querySelector("[data-action=print]").disabled) net.querySelector("[data-net-status]").textContent="Illustrative example";
  net.querySelector(".property-card").toggleAttribute("data-listing",!!listing);
  const chosen = net.querySelector('[name="location"]');
  if (listing) {
    net.querySelector("#estimate-kind").textContent = "Listing worksheet";
    net.querySelector("#estimate-caption").textContent = listing.label;
    net.querySelector("#estimate-hint").textContent = chosen.value ? chosen.selectedOptions[0].textContent :
      listing.city === "Sacramento" ? "Check whether the property is inside Sacramento city limits to select its transfer tax." : "Choose the transfer-tax location below to calculate proceeds.";
    return;
  }
  const property = net.querySelector('[name="property"]').value.trim();
  const detail = estimateState === "sample" ? "Roseville, California" : property && property !== sampleInputs.property ? property : "Seller worksheet";
  net.querySelector("#estimate-kind").textContent = estimateState === "sample" ? "Illustrative example" : estimateState === "modified-sample" ? "Edited example" : "Your estimate";
  net.querySelector("#estimate-caption").textContent = detail;
  net.querySelector("#estimate-hint").textContent = estimateState === "sample" ? "Illustrative amounts and negotiated fees." : estimateState === "modified-sample" ? "Review all sample amounts before sharing." : chosen.value ? chosen.selectedOptions[0].textContent : "Enter the agreed figures below.";
}
function quickNet() {
  net.querySelector("[data-quick-label]").textContent=net.querySelector("[data-net-label]").textContent;
  net.querySelector("[data-quick-net]").textContent=net.querySelector("[data-net]").textContent;
  net.querySelector(".mobile-net").hidden=net.querySelector("[data-action=print]").disabled;
}
function setEstimate(example) {
  editing = true;
  inputRegion.querySelectorAll("[name]").forEach(n => {
    n.value = example && Object.hasOwn(sampleInputs, n.name) ? sampleInputs[n.name] : ["cityShare","countyShare"].includes(n.name) ? "100" : "";
  });
  estimateState = example ? "sample" : "blank";
  net.dataset.exampleState=estimateState;
  inputRegion.dispatchEvent(new Event("input",{bubbles:true}));
  estimateHeading();
  quickNet();
  editing = false;
}
inputRegion.addEventListener("input", () => {
  if (!editing) { if (!listing && estimateState === "sample") estimateState = "modified-sample"; estimateHeading(); }
  quickNet();
});
inputRegion.addEventListener("change",quickNet);
const routeActions = document.getElementById("heading-actions");
const main = document.getElementById("content");
let active = "";
function closeNav() {
  deskRoot.classList.remove("menu-open"); document.getElementById("nav-toggle").setAttribute("aria-expanded","false");
}
function changeRoute() {
  const requested = location.hash.slice(1);
  if (!enteredDesk || requested === "start" || (!requested && active)) {
    if (!enteredDesk && Object.hasOwn(deskRoutes,requested)) returnRoute = requested;
    showEntry();
    return;
  }
  showDesk();
  if (requested === "content" && active) {main.focus();return;}
  const route = Object.hasOwn(deskRoutes,requested) ? requested : "net";
  const details = deskRoutes[route];
  deskRoot.querySelectorAll("[data-section]").forEach(s => s.hidden = s.dataset.section !== route);
  deskRoot.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === route) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  document.title = details[0] + " | The Closing Desk";
  document.getElementById("page-title").textContent = details[2];
  document.getElementById("page-desc").textContent = details[3];
  routeActions.replaceChildren();
  if (route === "net") {
    routeActions.innerHTML = '<button class="ghost" type="button" data-reset>'+deskIcon("edit-3")+'Start blank</button><button class="primary" type="button" data-print>'+deskIcon("printer")+'Print / PDF</button>';
    routeActions.querySelector("[data-reset]").onclick = () => {
      const hasEdits = listing ? [...inputRegion.querySelectorAll('input:not([name=property]):not([name$=Share]),select')].some(n=>n.value) :
        estimateState === "modified-sample" || (estimateState === "blank" && [...inputRegion.querySelectorAll("input:not([name$=Share]),select")].some(n=>n.value));
      if (hasEdits && !window.confirm("Clear the amounts currently entered in this net sheet?")) return;
      if (listing) {ownerFees.restore(null);worksheets.net.startBlank();ownerFees.render();} else setEstimate(false);
      net.querySelector("[name=price]").focus(); syncPrint();
    };
    routeActions.querySelector("[data-print]").onclick = () => net.querySelector("[data-action=print]").click();
    syncPrint();
  }
  closeNav();
  if (active && active !== route) { window.scrollTo(0,0); main.focus({preventScroll:true}); }
  active = route;
}
function syncPrint() {
  const b = routeActions.querySelector("[data-print]");
  if (b) b.disabled = net.querySelector("[data-action=print]").disabled;
}
inputRegion.addEventListener("input",syncPrint); inputRegion.addEventListener("change",syncPrint);
document.getElementById("nav-toggle").onclick = () => {
  const open = deskRoot.classList.toggle("menu-open");
  document.getElementById("nav-toggle").setAttribute("aria-expanded",String(open));
  if (open) deskRoot.querySelector('nav [aria-current="page"]')?.focus({preventScroll:true});
};
deskRoot.addEventListener("pointerdown", event => {
  if (deskRoot.classList.contains("menu-open") && !event.target.closest("#sidebar,#nav-toggle")) closeNav();
});
deskRoot.querySelector("nav").addEventListener("click",closeNav);
document.addEventListener("keydown",e=>{if(e.key==="Escape" && deskRoot.classList.contains("menu-open")){closeNav();document.getElementById("nav-toggle").focus();}});
const shareDialog = document.getElementById("share-dialog");
function downloadDesk() {
  const copy = document.documentElement.cloneNode(true);
  copy.querySelector("#root").replaceChildren();
  copy.querySelector("#root").removeAttribute("class");
  copy.querySelectorAll(".sc-printpage").forEach(el => el.remove());
  copy.querySelector("body").removeAttribute("class");
  copy.querySelector("title").textContent = "The Closing Desk | Seller resources";
  const blob = new Blob(["<!doctype html>\n"+copy.outerHTML],{type:"text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "The Closing Desk.html"; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
document.getElementById("share-desk").onclick = () => {
  const hosted = /^https?:$/.test(location.protocol) && !["localhost","127.0.0.1","[::1]","terminal.local"].includes(location.hostname);
  const controls = document.getElementById("share-controls");
  document.getElementById("share-message").textContent = hosted ? "Share a clean copy of the desk with another agent. Worksheet entries stay in this browser." : "Download a clean copy of this website to share with an agent. They can open the file in a browser. Your worksheet entries stay here.";
  controls.innerHTML = (hosted ? '<label>Website link<input class="share-url" readonly></label><button class="primary" type="button" data-copy>Copy website link</button>' : "") + '<button type="button" class="'+(hosted?"ghost":"primary")+'" data-download>'+deskIcon("download")+'Download website</button>';
  const notice=shareDialog.querySelector(".share-status");notice.textContent="";
  if (hosted) {
    const link=location.origin+location.pathname;
    const box=controls.querySelector("input");box.value=link;
    controls.querySelector("[data-copy]").onclick=async()=>{try {await navigator.clipboard.writeText(link);notice.textContent="Website link copied.";} catch {box.focus();box.select();notice.textContent="Select and copy the link above.";}};
  }
  controls.querySelector("[data-download]").onclick=()=>{downloadDesk();notice.textContent="Clean website copy downloaded.";};
  shareDialog.showModal();
};
shareDialog.querySelector("[data-dismiss]").onclick=()=>shareDialog.close();

const storageKey = "closingDeskListing.v1";
const resourceDrafts = new Map();
const workspace = deskRoot.querySelector(".shell");
const deskHeader = deskRoot.querySelector(".mobile-head");
const skipDesk = deskRoot.querySelector(".skip");
const intake = createListingEntry((raw, price, resolved) => {
  const next = createDeskProfile(raw,price,resolved);
  readTaxBasis(next,next.id === listing?.id ? currentTaxBasis() : taxDrafts.get(next.id));
  activateDesk(next);
}, () => activateDesk(null), () => goToDesk(returnRoute));
deskRoot.prepend(intake.entry);

function viewDraft() {
  return {
    tasks:[...deskSection("guide").querySelectorAll("[data-task]:checked")].map(x=>x.dataset.task),
    city:deskSection("market").querySelector(".mk-city-pick")?.value,
    metric:deskSection("market").querySelector(".mk-metric-pick")?.value,
    directory:Object.fromEntries([...deskSection("directory").querySelectorAll("[data-dir]")].map(x=>[x.dataset.dir,x.value]))
  };
}
function restoreViews(draft) {
  const guide = deskSection("guide");
  for (const box of guide.querySelectorAll("[data-task]")) box.checked = Array.isArray(draft?.tasks) && draft.tasks.includes(box.dataset.task);
  guide.querySelector("[data-task]")?.dispatchEvent(new Event("change",{bubbles:true}));
  function restoreField(field, value) {
    if (!field || typeof value !== "string") return;
    if (field.tagName === "SELECT" && ![...field.options].some(opt=>opt.value===value)) return;
    field.value = value;
    field.dispatchEvent(new Event(field.type === "search" ? "input" : "change",{bubbles:true}));
  }
  restoreField(deskSection("market").querySelector(".mk-city-pick"),draft?.city);
  restoreField(deskSection("market").querySelector(".mk-metric-pick"),draft?.metric);
  for (const field of deskSection("directory").querySelectorAll("[data-dir]")) restoreField(field,draft?.directory?.[field.dataset.dir]);
}
function saveDesk() {
  if (restoring || !listing) return;
  const saved = {raw:listing.raw,price:listing.askingPrice,id:listing.id,...currentTaxBasis(),views:viewDraft(),ownerRate:ownerFees.snapshot()};
  for (const [key,tool] of Object.entries(worksheets)) saved[key] = tool.snapshot();
  try { sessionStorage.setItem(storageKey,JSON.stringify(saved)); } catch { /* Worksheets also work in memory. */ }
}
function syncHeader() {
  document.querySelector(".desk-title").textContent = listing ? listing.street || listing.label : "Your agent desk";
  document.getElementById("desk-locality").textContent = listing ? [listing.city,listing.state,listing.zip].filter(Boolean).join(" ") || listing.label : "Sacramento & Placer counties, California";
  document.querySelector("#change-listing span:last-child").textContent = listing ? "Change listing" : "Enter a listing";
  const related = netPanel.querySelector(".related");
  related.querySelector('[href="#market"] small').textContent = listing?.marketCity ? listing.marketCity+" asking prices and inventory" : "Explore area market reports";
  let shortcuts = net.querySelector(".listing-quick-links");
  if (!shortcuts) {
    shortcuts = document.createElement("div");
    shortcuts.className = "listing-quick-links";
    net.querySelector("#estimate-hint").after(shortcuts);
  }
  shortcuts.replaceChildren();
  if (listing) {
    for (const [route,label] of [["market",listing.marketCity ? listing.marketCity+" market report" : "Browse market reports"],["directory",listing.county ? listing.county+" County contacts" : "Find local contacts"]]) {
      const link = document.createElement("a");
      link.href = "#"+route;
      link.textContent = label;
      shortcuts.append(link);
    }
  }
  shortcuts.hidden = !listing;
}
function activateDesk(profile, saved, navigate=true) {
  restoring = true;
  const previous = listing;
  const sameListing = previous && profile && previous.id === profile.id;
  if (previous) {resourceDrafts.set(previous.id,{...viewDraft(),ownerRate:ownerFees.snapshot()});taxDrafts.set(previous.id,currentTaxBasis());}
  listing = profile;
  for (const [key,tool] of Object.entries(worksheets)) {
    tool.setListing(listing);
    if (saved?.[key]) tool.restore(saved[key]);
  }
  if (!sameListing) {
    localViews.forEach(update=>update(listing));
    restoreViews(saved?.views || resourceDrafts.get(listing?.id));
  }
  if (!listing) {
    setEstimate(true);
    try { sessionStorage.removeItem(storageKey); } catch { /* No persistent storage. */ }
  }
  ownerFees.restore(saved?.ownerRate || resourceDrafts.get(listing?.id)?.ownerRate);
  resetParcelCheck();
  enteredDesk = true;
  restoring = false;
  syncHeader(); estimateHeading(); quickNet(); syncPrint(); saveDesk();
  if (navigate) goToDesk(returnRoute);
}
function showEntry() {
  closeNav();
  skipDesk.hidden = true; workspace.hidden = true; deskHeader.hidden = true;
  const entering = intake.entry.hidden;
  intake.entry.hidden = false;
  intake.prepare(listing,enteredDesk);
  document.title = "Start with a listing | The Closing Desk";
  if (entering) {window.scrollTo(0,0);intake.entry.querySelector("h1").focus({preventScroll:true});}
}
function showDesk() {
  intake.entry.hidden = true;
  workspace.hidden = false; deskHeader.hidden = false; skipDesk.hidden = false;
}
function goToDesk(route) {
  const key = Object.hasOwn(deskRoutes,route) ? route : "net";
  if (location.hash !== "#"+key) {
    try { history.pushState(null,"","#"+key); } catch { location.hash = key; }
  }
  changeRoute();
  window.scrollTo(0,0); main.focus({preventScroll:true});
}
document.getElementById("change-listing").onclick = () => {returnRoute = active || "net";location.hash = "start";};
workspace.addEventListener("input",saveDesk);
workspace.addEventListener("change",event => {
  if (!restoring && listing && event.target.name === "location") {
    const value = event.target.value;
    listing.taxLocation = ["placer","sac-city","sac-county"].includes(value) ? value : "";
    listing.taxOrigin = "agent";
    listing.taxBasis = listing.taxLocation ? "Transfer-tax location selected by the agent." : "";
    resetParcelCheck();
    restoring = true;
    Object.values(worksheets).forEach(tool=>tool.setListing(listing));
    ownerFees.render();estimateHeading();quickNet();syncPrint();
    restoring = false;
  }
  saveDesk();
});
workspace.addEventListener("click",event => {
  if (event.target.closest("[data-action=add],[data-action=remove],[data-clear]")) saveDesk();
});
workspace.addEventListener("listingworksheetchange",() => {if (!restoring) {estimateHeading();quickNet();syncPrint();saveDesk();}});
window.addEventListener("hashchange",changeRoute);
let savedListing = null;
try { savedListing = JSON.parse(sessionStorage.getItem(storageKey)); } catch { /* New or unavailable tab storage. */ }
if (typeof savedListing?.raw === "string" && savedListing.raw.length<=240) {
  const profile = createDeskProfile(savedListing.raw,savedListing.price,resolveListingLocation(savedListing.raw));
  if (savedListing.id === profile.id) {
    readTaxBasis(profile,savedListing);
    activateDesk(profile,savedListing,false);
  }
}
const standaloneSheet = !!document.querySelector('meta[name="standalone-seller-sheet"]');
const previewParams = new URLSearchParams(location.search);
if (standaloneSheet) document.documentElement.classList.add("sheet-standalone");
if ((standaloneSheet || previewParams.get("sample")==="1") && !enteredDesk) {
  returnRoute="net"; activateDesk(null);
} else if (!location.hash) showEntry(); else changeRoute();
if (!standaloneSheet && location.origin==="https://spencergregg2723-del.github.io") {
  const access=net.querySelector("[data-address-access]");
  const privatePreview=previewParams.get("preview")==="propertyradar";
  const addressField=inputRegion.querySelector("[name=property]");
  function privateUrl(address,price) {
    return "http://127.0.0.1:3187/closing-desk.html#"+new URLSearchParams({open:address,price});
  }
  const link=document.createElement("a");
  link.textContent="Prefill from address with PropertyRadar";
  link.target="_blank";link.rel="noopener noreferrer";
  function updatePrivateLink() {
    const typed=addressField.value.trim();
    const address=listing?.label || (typed===sampleInputs.property ? "" : typed);
    link.href=privateUrl(address,listing?.askingPrice || "");
  }
  updatePrivateLink();
  workspace.addEventListener("listingworksheetchange",updatePrivateLink);
  addressField.addEventListener("input",updatePrivateLink);
  link.addEventListener("click",updatePrivateLink);
  const note=document.createElement("small");
  note.textContent="Opens the private worksheet on your connected computer. Available pricing fills before any export.";
  if (privatePreview) access.append(link,note);
  else {
    const details=document.createElement("details");
    const summary=document.createElement("summary");summary.textContent="Agent address autofill";
    details.append(summary,link,note);access.append(details);
  }
  access.hidden=false;
  if (privatePreview) {
    const form=intake.entry.querySelector("form");
    const submit=form.querySelector('[type="submit"]');
    submit.textContent="Prefill seller net sheet";
    intake.entry.querySelector(".entry-privacy").textContent="This preview opens the address in your private PropertyRadar worksheet on this computer.";
    form.addEventListener("submit",event=>{
      const raw=form.querySelector("#listing-address").value.trim(), resolved=resolveListingLocation(raw);
      if (!resolved.street || !(resolved.city || resolved.zip) || ["partial","conflict"].includes(resolved.status)) return;
      event.preventDefault();event.stopImmediatePropagation();
      location.assign(privateUrl(raw,form.querySelector("#listing-price").value));
    },{capture:true});
  }
}
